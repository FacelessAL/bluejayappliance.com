<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Blue Jay Bird Favicon -->
  <!-- Body -->
  <ellipse cx="30" cy="36" rx="16" ry="14" fill="#1565C0"/>
  <!-- Belly -->
  <ellipse cx="30" cy="40" rx="10" ry="10" fill="#E3F2FD"/>
  <!-- Wing -->
  <path d="M20 30 Q14 26 8 32 Q12 34 16 36 Q20 38 24 36 Z" fill="#0D47A1"/>
  <path d="M20 30 Q16 28 12 30" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Head -->
  <circle cx="38" cy="24" r="10" fill="#1E88E5"/>
  <!-- Crest -->
  <path d="M38 14 Q42 8 46 10 Q44 14 40 16 Z" fill="#1565C0"/>
  <path d="M36 15 Q38 10 42 11" fill="none" stroke="#0D47A1" stroke-width="1"/>
  <!-- Eye ring (white) -->
  <circle cx="42" cy="22" r="4" fill="#ffffff"/>
  <!-- Eye -->
  <circle cx="42.5" cy="21.5" r="2.5" fill="#0F1B2D"/>
  <circle cx="43.5" cy="20.5" r="0.8" fill="#ffffff"/>
  <!-- Beak -->
  <path d="M48 24 L56 23 L48 26 Z" fill="#37474F"/>
  <!-- Black necklace marking -->
  <path d="M28 30 Q34 34 42 30" stroke="#0F1B2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M14 36 Q6 42 4 50 Q8 48 12 44 Q14 42 16 40 Z" fill="#0D47A1"/>
  <path d="M14 38 Q8 44 6 48" stroke="#1565C0" stroke-width="1" fill="none"/>
  <!-- Legs -->
  <line x1="26" y1="48" x2="24" y2="56" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="48" x2="36" y2="56" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 56 L24 56 L26 54" stroke="#37474F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M32 54 L36 56 L40 56" stroke="#37474F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
